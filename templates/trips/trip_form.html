{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ title }} - Car Management{% endblock %}

{% block breadcrumbs %}
<a href="{% url 'trips:list' %}">Viagens</a>
<span class="cm-breadcrumb-sep">/</span>
<span class="current">{{ title }}</span>
{% endblock %}

{% block content %}
<div class="cm-page">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card shadow-sm">
                <div class="card-header bg-transparent py-3 d-flex justify-content-between align-items-center">
                    <h1 class="h5 mb-0"><i class="bi bi-geo-alt me-2 text-primary"></i>{{ title }}</h1>
                    <a href="{% url 'trips:list' %}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Voltar
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% crispy form %}
                        <div class="d-none d-md-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'trips:list' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i>Salvar Viagem
                            </button>
                        </div>
                        <div class="cm-mobile-form-actions d-md-none">
                            <a href="{% url 'trips:list' %}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
                            <button type="submit" class="btn btn-primary flex-fill"><i class="bi bi-check-lg me-1"></i>Salvar Viagem</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

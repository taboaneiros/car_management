{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Editar Perfil - Car Management{% endblock %}

{% block breadcrumbs %}<a href="{% url 'users:profile' %}">Meu Perfil</a><span class="cm-breadcrumb-sep">/</span><span class="current">Editar</span>{% endblock %}

{% block content %}
<div class="cm-page">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Editar Perfil</h1>
        <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check me-1"></i>Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
